# Import Philippine job listings from the Jooble API into internal_jobs
# (backend/README.md#jooble-job-import). Needs repository secrets JOOBLE_API_KEY,
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY; without them the job prints
# "skipped" and succeeds.
#
# Manual only: every search is one request of the Jooble key's quota. Once you
# know your key's allowance, add a schedule, for example weekly:
#   schedule:
#     - cron: "17 19 * * 0" # Monday 03:17 Asia/Manila
name: Jooble job import

on:
  workflow_dispatch:
    inputs:
      request_budget:
        description: Most Jooble requests this run may make (one per search page)
        type: number
        default: 36
      dry_run:
        description: Fetch and report only (write nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: jooble-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The skill extractor imports the matching service, which needs the full
      # backend requirements; torch comes from the CPU index as in the Dockerfile.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r backend/requirements.txt
      - name: Import Jooble jobs
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUDGET: ${{ inputs.request_budget }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m backend.scripts.import_jooble_jobs --request-budget "$BUDGET" $DRY_RUN
